.ttl{width:100%;font-weight:700}
.bar i.lg{background:#8FCB6B}
.st{min-width:64px;justify-content:center}.amt{min-width:72px;text-align:end}

.tile{gap:10px;min-height:0;padding:14px;align-items:flex-start}.tile .ti{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;font-style:normal;background:color-mix(in srgb,var(--tc) 14%,transparent)}.tile b{font-size:19px;line-height:1.2}.tile span{font-size:13px}
.g2{margin-bottom:6px}.hp{background:rgba(255,255,255,.14);border-radius:14px;padding:12px;margin:8px 0 2px}.hp .fr{margin:0 0 8px}.hp>small{font-size:12px;display:block;margin-bottom:2px}.hp .pl{margin:0 -6px}
.bk{display:block;border:0;background:none;color:var(--lk);font-weight:700;font-size:13px;min-height:36px;padding:0;margin-bottom:2px}
.wt{grid-template-columns:100px repeat(7,minmax(0,1fr));min-width:330px}.wn{padding:0 8px}.wh{font-size:12px}
button.t{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:start}
.cb+.cb{border-top:1px solid var(--bd)}
.pl{display:flex;flex-wrap:wrap;margin:2px -6px 0}.sw{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0}.sw i{width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:#fff}.sw.on i{outline:3px solid #fff;outline-offset:2px}
.wt{display:grid}

.wc i{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px}

/* ===== classic theme ===== */
:root{--bg:#F5F1E8;--sf:#FFFEFB;--bd:#E2DACA;--tx:#1D2230;--mu:#6A6963;--ac:#1B2A41;--lk:#1B2A41;--gd:#9A7B3F;--onac:#FFFDF8;--ok:#2F6B4A;--okb:#E4EEE7;--wt:#80601A;--wtb:#F6EDD6;--lt:#8F2F2F;--ltb:#F3E1DE;--chip:#EFE9DC;--tr:#E9E3D5;--g:#3F8A5F;--y:#C9992E;--r:#B5483C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1218;--sf:#171B23;--bd:#272D38;--tx:#ECE7DC;--mu:#9CA1A9;--ac:#C2A265;--lk:#D5B97B;--gd:#C2A265;--onac:#14110A;--ok:#7FC79B;--okb:#1B2F25;--wt:#E3C070;--wtb:#33290F;--lt:#EC9B94;--ltb:#3A2020;--chip:#212630;--tr:#262C37}}
:root[data-theme="dark"]{--bg:#0F1218;--sf:#171B23;--bd:#272D38;--tx:#ECE7DC;--mu:#9CA1A9;--ac:#C2A265;--lk:#D5B97B;--gd:#C2A265;--onac:#14110A;--ok:#7FC79B;--okb:#1B2F25;--wt:#E3C070;--wtb:#33290F;--lt:#EC9B94;--ltb:#3A2020;--chip:#212630;--tr:#262C37}
h1,.hero h1,.ban b,.hs b,.tile b{font-family:'Frank Ruhl Libre','Heebo',serif;font-weight:700}
h1{font-size:28px;letter-spacing:.2px}
.top{padding-top:20px}
.card{border-radius:12px;box-shadow:0 1px 2px rgba(27,42,65,.04)}
.btn{border-radius:10px;color:var(--onac);letter-spacing:.2px}
.seg .on,.chip.on,.d.t0{color:var(--onac)}
input,select{border-radius:10px}
.sec b{color:var(--gd);font-size:13px;letter-spacing:.3px}
.sec b::before{content:'';display:inline-block;width:14px;height:1px;background:var(--gd);margin-inline-end:8px;vertical-align:middle}
.tab.on{color:var(--lk);border-top-color:var(--gd)}
.hero{border-radius:0 0 18px 18px;padding:22px 20px 20px;box-shadow:inset 0 -3px 0 #C2A265}
.hero p{font-size:14px;opacity:.85;letter-spacing:.3px}.hero h1{font-size:40px;line-height:1.1;margin-top:6px}
.hs div{background:transparent;border:1px solid rgba(194,162,101,.55);border-radius:10px}.hs b{font-size:22px}.hs span{opacity:.8}
.hero .lk{opacity:.9;font-weight:500}
.ban{border-radius:12px;box-shadow:inset 0 0 0 1px rgba(194,162,101,.4);background-image:linear-gradient(135deg,rgba(255,255,255,.05),rgba(0,0,0,.12))}
.ban::after{filter:grayscale(1) brightness(2.2);opacity:.1}.ban span{opacity:.8;letter-spacing:.3px}.ban b{font-size:24px}
.ban[style*="#1B4DDB"]{background-color:#1B2A41!important}.ban[style*="#14573F"]{background-color:#1F3D33!important}.ban[style*="#2F6F8F"]{background-color:#1F4650!important}.ban[style*="#3F4A59"]{background-color:#2B2F38!important}.ban[style*="#4D6B2F"]{background-color:#34462A!important}.ban[style*="#7A3E6E"]{background-color:#46283D!important}.ban[style*="#A15C00"]{background-color:#5E4423!important}
.tile{border-radius:12px;padding:16px 14px;gap:12px;box-shadow:0 1px 2px rgba(27,42,65,.04)}
.tile .ti{background:none!important;width:auto;height:auto;border-radius:0;color:var(--gd);display:block;line-height:0}
.tile b{font-size:21px;font-weight:700;color:var(--tx)}.tile span.tl{font-size:13px;color:var(--mu);letter-spacing:.2px}
.bar,.bar i{height:5px;border-radius:3px}
.q,.em,.st{border-radius:8px}
.sw i{border-color:rgba(255,255,255,.5)}
.gz{width:70px;height:70px;margin:0 auto;border:1.5px solid #C2A265;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Frank Ruhl Libre',serif;font-size:36px;color:#C2A265}

/* ===== modern theme ===== */
:root[data-st="m"]{--bg:#F2F4FB;--sf:#FFFFFF;--bd:#E4E8F4;--tx:#141A33;--mu:#6B7391;--ac:#4F46E5;--lk:#4F46E5;--gd:#7C3AED;--onac:#fff;--ok:#0E8A5F;--okb:#DDF5EA;--wt:#9A5B00;--wtb:#FFF0D2;--lt:#C7283B;--ltb:#FFE2E5;--chip:#ECEFFA;--tr:#E6E9F6;--g:#18B77E;--y:#F5B027;--r:#EF4B5F}
@media (prefers-color-scheme:dark){:root[data-st="m"]:not([data-theme="light"]){--bg:#0C0F1F;--sf:#151A30;--bd:#252C4A;--tx:#EEF0FF;--mu:#98A0C4;--ac:#8B83FF;--lk:#A9A3FF;--gd:#B38CFF;--onac:#0C0F1F;--ok:#5FE0AE;--okb:#12362B;--wt:#FFD27A;--wtb:#3A2D0E;--lt:#FF9AA6;--ltb:#40202A;--chip:#1E2440;--tr:#222949}}
:root[data-st="m"][data-theme="dark"]{--bg:#0C0F1F;--sf:#151A30;--bd:#252C4A;--tx:#EEF0FF;--mu:#98A0C4;--ac:#8B83FF;--lk:#A9A3FF;--gd:#B38CFF;--onac:#0C0F1F;--ok:#5FE0AE;--okb:#12362B;--wt:#FFD27A;--wtb:#3A2D0E;--lt:#FF9AA6;--ltb:#40202A;--chip:#1E2440;--tr:#222949}

[data-st="m"] h1{font-size:28px;letter-spacing:-.3px}

async function attach(uid){
const uref=FS.doc('users/'+uid);let hid=null;const us=await uref.get();if(us.exists)hid=(us.data()||{}).hid||null;
const j=joinId();
if(j&&j!==hid){try{await FS.doc('houses/'+j).update({members:firebase.firestore.FieldValue.arrayUnion(uid)});hid=j;await uref.set({hid})}
catch(e){AU.phase='full';render();return}}
if(j)try{history.replaceState(null,'',location.pathname)}catch(e){}
if(!hid){hid=newId();await FS.doc('houses/'+hid).set({members:[uid],owner:uid,at:Date.now()});await uref.set({hid})}
HID=hid;const base='houses/'+hid+'/';DBH={doc:p=>FS.doc(base+p),collection:c=>FS.collection(base+c)};
const er=e=>{AU.err='בעיית חיבור למסד הנתונים';if(AU.phase=='loading')AU.phase='nodb';render()};
UNS.push(DBH.collection('members').onSnapshot(sn=>{const a=sn.docs.map(d=>[d.id,d.data()||{}]).sort((x,y)=>(x[1].at||0)-(y[1].at||0));AU.members=a.map(x=>x[0]);MEMOK=true;decide()},er));
UNS.push(DBH.collection('house').onSnapshot({includeMetadataChanges:false},sn=>{if(sn.metadata&&sn.metadata.hasPendingWrites&&AU.phase=='app')return;sn.docs.forEach(d=>{const x=d.data();if(x&&typeof x.v=='string')PEND[d.id]=x.v});HOUSEOK=true;decide()},er));
setTimeout(()=>{if(AU.phase=='loading'){AU.phase='nodb';render()}},15000)}
async function boot(){render();
document.addEventListener('focusout',()=>{setTimeout(flush,60)});
try{firebase.initializeApp(FBC);FBA=firebase.auth();FS=firebase.firestore();try{await FBA.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){}}catch(e){AU.phase='nodb';render();return}
try{await FBA.getRedirectResult()}catch(e){AU.err='הכניסה לא הצליחה. נסו שוב'}
FBA.onAuthStateChanged(async u=>{if(!u){AU.uid=null;AU.phase='signin';render();return}if(AU.uid===u.uid&&HID)return;
AU.uid=u.uid;AU.phase='loading';render();try{await attach(u.uid)}catch(e){AU.phase='nodb';AU.err='לא הצלחנו לפתוח את הבית ('+(e&&e.code||'שגיאה')+')';render()}})}
boot();
</script>
</body>
</html>
